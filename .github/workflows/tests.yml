name: API tests
run-name: Test ${{ github.event.inputs.ENV }} | ${{ github.event.inputs.MARKER }} marker | ${{ github.event.inputs.THREADS }} treads

on:
  workflow_dispatch:
    inputs:
      ENV:
        description: "Environment"
        required: true
        type: environment
        default: "cloud_dev"

      MARKER:
        description: "Select pytest marker"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - smoke
          - regression

      THREADS:
        description: "Select threads count"
        required: false
        default: "1"
        type: choice
        options:
          - "1"
          - "3"
          - "5"

jobs:
  api-tests:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.ENV }}

    steps:
      # Клонируем репозиторий
      - uses: actions/checkout@v4

      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: ./.github/gh-pages

      # Подготовка environment.properties
      - name: Prepare Allure environment
        run: |
          mkdir -p allure-results
          echo "Branch=${{ github.ref_name }}" > allure-results/environment.properties
          echo "Commit=${{ github.sha }}" >> allure-results/environment.properties
          echo "Environment=${{ github.event.inputs.ENV }}" >> allure-results/environment.properties
          
          # Копируем историю ПЕРЕД запуском тестов
          mkdir -p allure-results/history
          if [ -d "./.github/gh-pages/history" ]; then
            cp -R ./.github/gh-pages/history/* allure-results/history/
            echo "✅ History copied from previous report"
            ls -la allure-results/history/
          else
            echo "⚠️ No history found - first run"
          fi

      # Создание .env файла
      - name: Create .env file with credentials only
        run: |
          cat > .env << EOF
          ENV=${{ github.event.inputs.ENV }}
          DEV_LOGIN=${{ secrets.DEV_LOGIN }}
          DEV_PASSWORD=${{ secrets.DEV_PASSWORD }}
          DEV_CLIENT_ID=${{ secrets.DEV_CLIENT_ID }}
          CLOUD_LOGIN=${{ secrets.CLOUD_LOGIN }}
          CLOUD_PASSWORD=${{ secrets.CLOUD_PASSWORD }}
          CLOUD_CLIENT_ID=${{ secrets.CLOUD_CLIENT_ID }}
          STAGE_LOGIN=${{ secrets.STAGE_LOGIN }}
          STAGE_PASSWORD=${{ secrets.STAGE_PASSWORD }}
          STAGE_CLIENT_ID=${{ secrets.STAGE_CLIENT_ID }}
          EOF

      # Создание data_current_user.json
      - name: Create auth token file
        run: |
          mkdir -p config
          echo '${{ secrets.AUTH_TOKEN_DATA }}' > config/.data_current_user.json
          echo "✅ Auth token file created"

      # Запуск тестов
      - name: Run API tests via docker
        env:
          STAGE: ${{ secrets.STAGE }}
          MARKER: ${{ github.event.inputs.MARKER }}
          THREADS: ${{ github.event.inputs.THREADS }}
        run: |
          docker compose build --no-cache tests
          docker compose up tests --exit-code-from tests

      # Шаг 5 - Генерация отчета
      - name: Generate Allure-report
        if: always()
        env:
          STAGE: ${{ secrets.STAGE }}
        run: |
          docker compose up report

      # Проверка отчета
      - name: Verify Allure report
        run: |
          echo "✅ Allure report generated successfully"
          echo "📊 Report size: $(du -sh allure-report | cut -f1)"
          echo "📁 Files count: $(find allure-report -type f | wc -l)"
          echo "=== History in report ==="
          ls -la allure-report/history/ || echo "No history in report"

      # Шаг 6 - Деплой на gh-pages
      - name: Deploy to Github Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          token: ${{ secrets.CI_TOKEN }}
          branch: gh-pages
          folder: allure-report
          clean: true

      - name: Debug Pages status
        run: |
          echo "🔍 Check if Pages is enabled in repo settings"
          echo "📊 Report should be at: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"