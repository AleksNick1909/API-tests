name: API tests
run-name: Test ${{ github.event.inputs.ENV }} | ${{ github.event.inputs.MARKER }} marker | ${{ github.event.inputs.THREADS }} treads

on:
  workflow_dispatch:
    inputs:
      ENV:
        description: "Environment"
        required: true
        type: environment
        default: "cloud_dev"

      MARKER:
        description: "Select pytest marker"
        required: true
        default: "smoke"
        type: choice
        options:
          - smoke
          - regression

      TREADS:
        description: "Select threads count"
        required: false
        default: "1"
        type: choice
        options:
          - 3
          - 5

jobs:
  api-tests:
    runs-on: ubuntu-latest
    environment: ${{ inputs.ENV }}

    steps:
      # Клонируем репозиторий
      - uses: actions/checkout@v2

      - uses: actions/checkout@v2
        with:
          ref: gh-pages
          path: ./.github/gh-pages

      # Подготовка environment.properties
      - name: Prepare Allure environment
        run: |
          mkdir -p allure-results
          echo "Branch=${{ github.ref_name }}" > allure-results/environment.properties
          echo "Commit=${{ github.sha }}" >> allure-results/environment.properties
          echo "Environment=${{ inputs.ENV }}" >> allure-results/environment.properties

      # Запуск тестов (скорее всего нужно добавить переменные логин и пароль)
      - name: Run API tests via docker
        env:
          STAGE: ${{ secrets.STAGE }}
        run: |
          docker-compose up tests

      # Шаг 4 - Копирование истории
      - name: Copy Allure history
        run: |
          mkdir -p allure-results/history
          if [ -d "./.github/gh-pages/history" ]; then
            cp -R ./.github/gh-pages/history/* allure-results/history/
          fi

      # Шаг 5 - Генерация отчета
      - name: Generate Allure-report
        env:
          BROWSER: ${{ inputs.BROWSER }}
          STAGE: ${{ secrets.STAGE }}
          CI_COMMIT_REF_NAME: ${{ github.ref_name }}
          CI_COMMIT_SHORT_SHA: ${{ github.sha }}
        run: |
          docker compose up report

      # Шаг 6 - Деплой на gh-pages
      - name: Deploy to Github Pages
        uses: JamesIves/github-pages-deploy-action@4.1.5
        with:
          token: ${{ secrets.CI_TOKEN }}
          branch: gh-pages
          folder: allure-report
          clean: false